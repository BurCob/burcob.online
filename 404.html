<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінку не знайдено — BurCob</title>
  <meta name="description" content="Такої сторінки на сайті BurCob немає. Поверніться на українську або англійську головну, або напишіть у Telegram.">
  <meta name="theme-color" content="#181819">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("burcob-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <main class="page-404">
    <div class="card">
      <p class="kicker">404</p>
      <h1>Такої сторінки немає</h1>
      <p class="lede">Поверніться на головну BurCob або напишіть Антону чи Валентину в Telegram.</p>
      <p class="lede" lang="en">This page does not exist. Go back to the BurCob home page, or message Anton or Valentyn on Telegram.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Українською</a>
        <a class="btn btn-ghost" href="/en/" hreflang="en" lang="en">English</a>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="https://t.me/tony_kobs" target="_blank" rel="noopener noreferrer">Telegram · Антон</a>
        <a class="btn btn-ghost" href="https://t.me/Groteskzp" target="_blank" rel="noopener noreferrer">Telegram · Валентин</a>
      </div>
    </div>
  </main>
</body>
</html>
