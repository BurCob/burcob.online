name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Перевірка сайту
        run: python3 scripts/check_site.py

  build:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Зібрати артефакт сайту
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Налаштувати Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Завантажити сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Опублікувати
        id: deployment
        uses: actions/deploy-pages@v4
